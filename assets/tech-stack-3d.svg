<svg viewBox="0 0 940 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="elevate" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <linearGradient id="gPython" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A9FD4"/><stop offset="100%" stop-color="#2c5c85"/>
    </linearGradient>
    <linearGradient id="gDjango" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f6b3a"/><stop offset="100%" stop-color="#0c2c17"/>
    </linearGradient>
    <linearGradient id="gDrf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c23030"/><stop offset="100%" stop-color="#6b0000"/>
    </linearGradient>
    <linearGradient id="gPostgres" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5d82e8"/><stop offset="100%" stop-color="#2a4bb0"/>
    </linearGradient>
    <linearGradient id="gMysql" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b93b8"/><stop offset="100%" stop-color="#2c5570"/>
    </linearGradient>
    <linearGradient id="gSqlite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f6a95"/><stop offset="100%" stop-color="#042a3d"/>
    </linearGradient>
    <linearGradient id="gDocker" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4db3ff"/><stop offset="100%" stop-color="#1670b8"/>
    </linearGradient>
    <linearGradient id="gSwagger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a7f14d"/><stop offset="100%" stop-color="#5fb81d"/>
    </linearGradient>
    <linearGradient id="gPostman" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8f5e"/><stop offset="100%" stop-color="#cc4f22"/>
    </linearGradient>
    <linearGradient id="gVercel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3a"/><stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="gGit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f97a5a"/><stop offset="100%" stop-color="#c93c22"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="940" height="420" rx="16" fill="url(#bg)"/>
  <text x="470" y="34" text-anchor="middle" font-family="Verdana, sans-serif" font-size="22" font-weight="bold" fill="#c9d1d9">Tech Stack</text>

  <!-- Column headers -->
  <g font-family="Verdana, sans-serif" font-size="15" font-weight="bold" fill="#58a6ff">
    <text x="125" y="70" text-anchor="middle">Language</text>
    <text x="355" y="70" text-anchor="middle">Backend</text>
    <text x="585" y="70" text-anchor="middle">Databases</text>
    <text x="815" y="70" text-anchor="middle">Tools &amp; DevOps</text>
  </g>
  <g stroke="#30363d" stroke-width="1">
    <line x1="20" y1="82" x2="230" y2="82"/>
    <line x1="250" y1="82" x2="460" y2="82"/>
    <line x1="480" y1="82" x2="690" y2="82"/>
    <line x1="710" y1="82" x2="920" y2="82"/>
  </g>

  <!-- Chip template: rounded rect + top gloss stripe + icon + label -->

  <!-- Column 1: Language -->
  <g filter="url(#elevate)">
    <rect x="20" y="100" width="210" height="46" rx="10" fill="url(#gPython)"/>
    <rect x="20" y="100" width="210" height="14" rx="10" fill="#ffffff" opacity="0.12"/>
  </g>
  <image href="https://cdn.simpleicons.org/python/ffffff" x="34" y="112" width="22" height="22"/>
  <text x="68" y="128" font-family="Verdana, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Python</text>

  <!-- Column 2: Backend -->
  <g filter="url(#elevate)">
    <rect x="250" y="100" width="210" height="46" rx="10" fill="url(#gDjango)"/>
    <rect x="250" y="100" width="210" height="14" rx="10" fill="#ffffff" opacity="0.12"/>
  </g>
  <image href="https://cdn.simpleicons.org/django/ffffff" x="264" y="112" width="22" height="22"/>
  <text x="298" y="128" font-family="Verdana, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Django</text>

  <g filter="url(#elevate)">
    <rect x="250" y="158" width="210" height="46" rx="10" fill="url(#gDrf)"/>
    <rect x="250" y="158" width="210" height="14" rx="10" fill="#ffffff" opacity="0.12"/>
  </g>
  <image href="https://cdn.simpleicons.org/django/ffffff" x="264" y="170" width="22" height="22"/>
  <text x="298" y="186" font-family="Verdana, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Django REST Framework</text>

  <!-- Column 3: Databases -->
  <g filter="url(#elevate)">
    <rect x="480" y="100" width="210" height="46" rx="10" fill="url(#gPostgres)"/>
    <rect x="480" y="100" width="210" height="14" rx="10" fill="#ffffff" opacity="0.12"/>
  </g>
  <image href="https://cdn.simpleicons.org/postgresql/ffffff" x="494" y="112" width="22" height="22"/>
  <text x="528" y="128" font-family="Verdana, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">PostgreSQL</text>

  <g filter="url(#elevate)">
    <rect x="480" y="158" width="210" height="46" rx="10" fill="url(#gMysql)"/>
    <rect x="480" y="158" width="210" height="14" rx="10" fill="#ffffff" opacity="0.12"/>
  </g>
  <image href="https://cdn.simpleicons.org/mysql/ffffff" x="494" y="170" width="22" height="22"/>
  <text x="528" y="186" font-family="Verdana, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">MySQL</text>

  <g filter="url(#elevate)">
    <rect x="480" y="216" width="210" height="46" rx="10" fill="url(#gSqlite)"/>
    <rect x="480" y="216" width="210" height="14" rx="10" fill="#ffffff" opacity="0.12"/>
  </g>
  <image href="https://cdn.simpleicons.org/sqlite/ffffff" x="494" y="228" width="22" height="22"/>
  <text x="528" y="244" font-family="Verdana, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">SQLite</text>

  <!-- Column 4: Tools & DevOps -->
  <g filter="url(#elevate)">
    <rect x="710" y="100" width="210" height="46" rx="10" fill="url(#gDocker)"/>
    <rect x="710" y="100" width="210" height="14" rx="10" fill="#ffffff" opacity="0.12"/>
  </g>
  <image href="https://cdn.simpleicons.org/docker/ffffff" x="724" y="112" width="22" height="22"/>
  <text x="758" y="128" font-family="Verdana, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Docker</text>

  <g filter="url(#elevate)">
    <rect x="710" y="158" width="210" height="46" rx="10" fill="url(#gSwagger)"/>
    <rect x="710" y="158" width="210" height="14" rx="10" fill="#ffffff" opacity="0.12"/>
  </g>
  <image href="https://cdn.simpleicons.org/swagger/000000" x="724" y="170" width="22" height="22"/>
  <text x="758" y="186" font-family="Verdana, sans-serif" font-size="15" font-weight="bold" fill="#0d1117">Swagger</text>

  <g filter="url(#elevate)">
    <rect x="710" y="216" width="210" height="46" rx="10" fill="url(#gPostman)"/>
    <rect x="710" y="216" width="210" height="14" rx="10" fill="#ffffff" opacity="0.12"/>
  </g>
  <image href="https://cdn.simpleicons.org/postman/ffffff" x="724" y="228" width="22" height="22"/>
  <text x="758" y="244" font-family="Verdana, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Postman</text>

  <g filter="url(#elevate)">
    <rect x="710" y="274" width="210" height="46" rx="10" fill="url(#gVercel)"/>
    <rect x="710" y="274" width="210" height="14" rx="10" fill="#ffffff" opacity="0.10"/>
  </g>
  <image href="https://cdn.simpleicons.org/vercel/ffffff" x="724" y="286" width="22" height="22"/>
  <text x="758" y="302" font-family="Verdana, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Vercel</text>

  <g filter="url(#elevate)">
    <rect x="710" y="332" width="210" height="46" rx="10" fill="url(#gGit)"/>
    <rect x="710" y="332" width="210" height="14" rx="10" fill="#ffffff" opacity="0.12"/>
  </g>
  <image href="https://cdn.simpleicons.org/git/ffffff" x="724" y="344" width="22" height="22"/>
  <text x="758" y="360" font-family="Verdana, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Git</text>
</svg>
